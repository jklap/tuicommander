name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Keep the sccache server alive across a compile longer than its 600s idle timer —
# see the note in release.yml.
#
# RUST_VERSION pins the compiler. `dtolnay/rust-toolchain@stable` floats: a new
# stable turns fresh clippy lints and rustfmt reflows into a red main for whoever
# pushes next, which has now happened three times (7db734f9, 20e58629, and the
# 1.98 lints cleared on 2026-08-31 while CI was still green on an older stable).
# To bump: raise the version HERE and in release.yml, nightly.yml and audit.yml in
# one commit, after `cargo clippy --all-targets -- -D warnings` and
# `cargo fmt --check` pass locally on that toolchain. CI then runs on the new
# compiler as part of that commit, so a breakage lands on its author.
# See docs/guides/ci.md.
env:
  SCCACHE_IDLE_TIMEOUT: "0"
  RUST_VERSION: "1.98.0"

jobs:
  socket:
    timeout-minutes: 15
    name: Socket Security
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    # Informational supply-chain scan — never a hard PR blocker. Socket's
    # sfw-wrapped installs add a network dependency on Socket's service, and an
    # upstream action retirement (socketdev/socket-security-action was deleted)
    # previously failed every PR at "Set up job". continue-on-error keeps the
    # scan running + reporting without gating merges on Socket availability.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      # Socket Firewall (free): blocks known-malicious npm/cargo packages at
      # install time. The legacy socket-security-action manifest scanner was
      # retired (repo deleted), so SocketDev/action now installs the `sfw`
      # wrapper and we run the installs through it. No Socket API token needed.
      # Pinned to an immutable SHA per Socket's supply-chain guidance.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Scan pnpm install through Socket Firewall
        run: sfw pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Scan cargo fetch through Socket Firewall
        run: cd src-tauri && sfw cargo fetch

  frontend:
    timeout-minutes: 20
    name: Frontend (typecheck + tests)
    runs-on: ubuntu-22.04
    steps:
      # The plugins submodule carries the built-in plugin sources that
      # src/__tests__/plugins/*.test.ts import directly; without it vitest
      # cannot resolve them and the suite fails to collect.
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Tests
        run: pnpm exec vitest run --reporter=verbose

  # Always runs: clippy + tests on Linux (fastest, catches most issues)
  rust:
    timeout-minutes: 60
    name: Rust (Linux-x64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # src/plugins.rs embeds the bundled plugins with include_str!, and they
          # live in the `plugins` submodule. Without this the crate cannot compile
          # at all: "couldn't read src/../../plugins/plan/manifest.json".
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      # shell_integration.rs launches the claude/codex wrappers in bash, zsh
      # AND fish. fish is on none of the runner images, and the tests used to
      # drop it silently when absent — so its half of the matrix reported as
      # passed without ever running. The script installs all three and fails
      # if any cannot be launched rc-free (fish needs >= 3.3 for --no-config).
      - name: Install launch-matrix shells
        run: scripts/install-launch-shells.sh

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Create dist stub for include_dir
        # Both shells, because the SPA fallback serves mobile.html for /mobile/*
        # and index.html for everything else. A stub carrying index.html alone
        # 404s every mobile deep link, which fails a test a real `vite build`
        # passes — the stub has to have the shape the build produces.
        run: mkdir -p dist && for f in index mobile; do echo '<html></html>' > "dist/$f.html"; done

      - name: Create sidecar stub for Tauri build.rs
        run: |
          target=$(rustc --print host-tuple)
          touch "src-tauri/binaries/tuic-bridge-${target}"
          touch "src-tauri/binaries/tuic-${target}"

      - name: Clippy
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo clippy -- -D warnings

      - name: Tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo nextest run --workspace --profile ci

      # nextest does not run doctests — run them separately so doc examples stay
      # covered. Linux-only: doctests are platform-independent logic.
      - name: Doctests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo test --doc

  # Verify tuic-remote compiles without the desktop feature (catches missing cfg
  # gates) AND run the headless test suite. The `#[cfg(not(feature = "desktop"))]`
  # tests — headless router refusals and the named-instance CLI contract — exist
  # only in this configuration, so nothing else in CI ever executes them.
  check-remote:
    timeout-minutes: 45
    name: Remote daemon (no-default-features)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
        with:
          # See the rust job: include_str! reaches into the `plugins` submodule.
          submodules: recursive

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev mold

      - name: Install launch-matrix shells
        run: scripts/install-launch-shells.sh

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Check tuic-remote
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo check --no-default-features --bin tuic-remote

      - name: Headless tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: '-fPIC'
          CMAKE_CXX_FLAGS: '-fPIC'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
        run: cargo nextest run --no-default-features --profile ci

  # Push to main only: verify build on macOS and Windows.
  # GPU notes:
  # - macOS: whisper-rs compiled with Metal (target-specific dep) — always GPU.
  # - Windows: whisper-rs is CPU-only. The Vulkan backend's vulkan-shaders-gen
  #   sub-build is chronically broken on the runner, so dictation runs on CPU.
  #   CUDA support is optional (add Jimver/cuda-toolkit + --features cuda if needed).
  rust-cross:
    timeout-minutes: 90
    name: Rust (${{ matrix.label }})
    # Runs on pull_request too, not just push. Gating it on push meant macOS and
    # Windows breakage was only ever discovered after a merge to main.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS-ARM
          - platform: windows-latest
            label: Windows-x64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # See the rust job: include_str! reaches into the `plugins` submodule.
          submodules: recursive

      # Keep the Windows build/target dir short (C:/t): whisper.cpp's nested
      # CMake TryCompile paths can exceed the 260-char MAX_PATH that MSBuild's
      # FileTracker enforces (it ignores LongPathsEnabled).
      - name: Short CARGO_TARGET_DIR (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "CARGO_TARGET_DIR=C:/t" >> $GITHUB_ENV

      # The launch matrix is #[cfg(unix)], so only the macOS leg needs it.
      - name: Install launch-matrix shells
        if: matrix.platform == 'macos-latest'
        run: scripts/install-launch-shells.sh

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # On Windows the real target dir is CARGO_TARGET_DIR=C:/t (MAX_PATH workaround).
          # rust-cache's `workspaces` input joins target with root, so it can't point at
          # an absolute path — use `cache-directories` instead.
          cache-directories: ${{ matrix.platform == 'windows-latest' && 'C:/t' || '' }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      # A restored Windows build cache (C:/t) may hold a CMakeCache.txt from an
      # older VS generator (e.g. VS 17 2022). When the runner image moves to a
      # newer VS (18 2026), CMake aborts: "generator does not match the generator
      # used previously". Drop the stale CMake config so whisper-rs-sys
      # reconfigures against the current toolchain (sccache still caches the
      # actual compiles, so the rebuild cost is minimal).
      - name: Clear stale CMake cache (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          if (Test-Path C:/t) {
            Get-ChildItem -Path C:/t -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -eq 'CMakeCache.txt' -or $_.Name -eq 'CMakeFiles' } |
              Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Create dist stub for include_dir
        shell: bash
        # Both shells, because the SPA fallback serves mobile.html for /mobile/*
        # and index.html for everything else. A stub carrying index.html alone
        # 404s every mobile deep link, which fails a test a real `vite build`
        # passes — the stub has to have the shape the build produces.
        run: mkdir -p dist && for f in index mobile; do echo '<html></html>' > "dist/$f.html"; done

      - name: Create sidecar stub for Tauri build.rs
        shell: bash
        run: |
          target=$(rustc --print host-tuple)
          touch "src-tauri/binaries/tuic-bridge-${target}"
          touch "src-tauri/binaries/tuic-${target}"
          # Windows needs .exe extension for sidecar resolution
          if [[ "$target" == *windows* ]]; then
            touch "src-tauri/binaries/tuic-bridge-${target}.exe"
            touch "src-tauri/binaries/tuic-${target}.exe"
          fi

      - name: Clippy
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '/Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '/Z7' || '' }}
        run: cargo clippy -- -D warnings

      # Windows runs the suite too. It used to be skipped, which is why Windows
      # regressions only ever surfaced in a user's build.
      - name: Tests
        working-directory: src-tauri
        env:
          SCCACHE_GHA_ENABLED: "true"
          RUSTC_WRAPPER: "sccache"
          CARGO_INCREMENTAL: "0"
          CMAKE_C_COMPILER_LAUNCHER: "sccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "sccache"
          CMAKE_C_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '/Z7' || '' }}
          CMAKE_CXX_FLAGS: ${{ matrix.label == 'macOS-ARM' && '-march=armv8.4-a' || matrix.label == 'Windows-x64' && '/Z7' || '' }}
        run: cargo nextest run --workspace --profile ci

      # The Windows test binary aborts at load with 0xc0000139
      # (STATUS_ENTRYPOINT_NOT_FOUND): a DLL it imports from is present but does
      # not export something it asks for. Windows names neither the DLL nor the
      # symbol, and nothing off-Windows can link this binary, so the failure has
      # to be read on the runner itself.
      #
      # Two passes have already cleared the usual suspects. `dumpbin /imports`:
      # every static import is a system DLL and none names a version-sensitive
      # symbol (VCRUNTIME140_1 asks only for __CxxFrameHandler4, MSVCP140 for no
      # __std_* helper). `Dependencies -modules`: the whole graph resolves — the
      # only NOT_FOUND entries are optional ext-ms-* extension API sets, which
      # are absent on every desktop Windows. The CRT in System32 is 14.51, newer
      # than what the linker targeted, so it is not a redist downgrade either.
      #
      # So the unresolved entry point is a *function* inside a DLL that itself
      # loads fine. `-chain` is the pass that reports imports per module rather
      # than modules alone; `-help` goes with it so a wrong flag costs a read of
      # this log rather than another 45-minute run.
      - name: Diagnose the test binary's load failure
        if: failure() && matrix.platform == 'windows-latest'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $exe = Get-ChildItem C:/t/debug/deps/tuicommander_lib-*.exe | Select-Object -First 1
          Write-Host "binary: $($exe.FullName)"

          choco install dependencies -y --no-progress | Out-Null
          $dep = Get-ChildItem "C:\ProgramData\chocolatey\lib\dependencies" -Recurse -Filter Dependencies.exe |
            Select-Object -First 1
          if ($dep) {
            Write-Host "== Dependencies -help =="
            & $dep.FullName -help
            Write-Host "== Dependencies -chain (unresolved imports show as ???) =="
            & $dep.FullName -chain $exe.FullName 2>&1 | Select-String -Pattern '\?\?\?|NOT_FOUND|Error' -Context 2,2
          } else {
            Write-Host "Dependencies.exe not found after install"
          }

          # Settled: System32's comctl32 5.82 exports the three *Subclass*
          # symbols but NOT TaskDialogIndirect, which is the unresolved entry
          # point. The open question is whether the Common-Controls 6 manifest
          # build.rs adds actually reaches this binary, so dump what it carries.
          Write-Host "== comctl32 exports =="
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" | Select-Object -First 1
          & $dumpbin.FullName /exports C:\Windows\System32\comctl32.dll |
            Select-String -Pattern 'TaskDialogIndirect|SetWindowSubclass|DefSubclassProc|RemoveWindowSubclass'

          Write-Host "== embedded manifest of the failing binary =="
          if ($dep) { & $dep.FullName -manifest $exe.FullName } else { Write-Host "no Dependencies.exe" }

          # Does the same lib load when nothing desktop-specific is linked in?
          # check-remote already proves the no-default-features build is sound on
          # Linux, so a load here would put the fault squarely in the desktop
          # feature set rather than in the crate.
          Write-Host "== no-default-features test binary =="
          cargo test --no-run --no-default-features --lib 2>&1 | Select-Object -Last 5
          $plain = Get-ChildItem C:/t/debug/deps/tuicommander_lib-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          & $plain.FullName --list --format terse 2>&1 | Select-Object -First 5
          Write-Host "exit: $LASTEXITCODE"

          # The CRT that is actually on this machine, against the one the linker
          # built for — a mismatch here is the classic source of 0xc0000139.
          Write-Host "== CRT in System32 =="
          'MSVCP140.dll','VCRUNTIME140.dll','VCRUNTIME140_1.dll' | ForEach-Object {
            $p = "C:\Windows\System32\$_"
            if (Test-Path $p) { "{0}  {1}" -f $_, (Get-Item $p).VersionInfo.FileVersion }
            else { "{0}  MISSING" -f $_ }
          }
