# Working-branch layout, shared by the reorg-and-rebase-onto-main and commit-to-wip skills.
# Sourced by bash; every value can be overridden from the environment.

# The long-lived working branch and the upstream it is rebased onto.
WIP_BRANCH=${WIP_BRANCH:-wip}
WIP_UPSTREAM=${WIP_UPSTREAM:-origin/main}

# Append-only files every feature touches. They live in one "ledgers" commit near the tip
# instead of inside feature commits, so a rebase resolves them once instead of per commit.
WIP_LEDGERS=${WIP_LEDGERS:-"CHANGELOG.md SPEC.md todo.md docs/FEATURES.md .gitignore"}

# Personal files that never go upstream. They live in one "personal scripts" commit at the
# very tip. Directories match recursively.
WIP_PERSONAL_PATHS=${WIP_PERSONAL_PATHS:-"build.sh force_perms.sh .rsync-filter tuic tuic-script.md tuic.bats .claude/agents"}

# Subjects of personal commits: the .gitignore lines they add stay out of the ledgers commit
# and go into the personal one.
WIP_PERSONAL_RE=${WIP_PERSONAL_RE:-'^personal scripts$|^ignore \.obsidian$'}

# Tip groups (2026-11-02). Each set is reset to the base's version in every commit (tree level, so
# it cannot conflict) and restored in its OWN commit between the ledgers and personal commits.
# Phase B: drop the `scrubbed` commit, regenerate the `generated` one, keep the `internal` one.
# Files main deleted upstream that wip still edits; the commit is dropped when rebasing.
WIP_SCRUBBED_PATHS=${WIP_SCRUBBED_PATHS:-"to-test.md"}
# Files named by basename at ANY depth, kept on wip only (never go upstream).
WIP_INTERNAL_NAMES=${WIP_INTERNAL_NAMES:-"AGENTS.md CLAUDE.md"}
# Generated files: take main's at every stop, regenerate once after the rebase.
WIP_GENERATED_PATHS=${WIP_GENERATED_PATHS:-"src-tauri/Cargo.lock THIRD_PARTY_NOTICES.md src-tauri/src/mcp_http/command_table_paths.txt src/generated/settingsCatalogue.ts src-tauri/src/fixtures/replay_oracle/corpus.jsonl"}
