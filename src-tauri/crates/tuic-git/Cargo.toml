[package]
name = "tuic-git"
version.workspace = true
edition = "2024"

[features]
default = []
test-support = []

[dependencies]
tuic-core = { path = "../tuic-core" }
dashmap = "6"
gix = { version = "0.85", default-features = false, features = [
    "sha1",
    "revision",
    "status",
    "blame",
    "blob-diff",
    "dirwalk",
    "parallel",
] }
hex = "0.4"
moka = { version = "0.12", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
strip-ansi-escapes = "0.2"
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tuic-test-support = { path = "../tuic-test-support" }

[lints]
workspace = true
