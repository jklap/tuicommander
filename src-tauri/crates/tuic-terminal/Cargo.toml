[package]
name = "tuic-terminal"
version.workspace = true
edition = "2024"

[dependencies]
alacritty_terminal = "0.26.0"
# Kitty deferred decode (terminal_image_transmission.rs).
base64 = "0.22"
dirs = "6"
lazy_static = "1"
parking_lot = "0.12"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
tracing = "0.1"

# Kitty `t=s` shared-memory medium (terminal_image_transmission.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }

[dev-dependencies]
flate2 = "1.1"
tempfile = "3"
tuic-ansi = { path = "../tuic-ansi" }
tuic-test-support = { path = "../tuic-test-support" }

[lints]
workspace = true
