# cargo-mutants configuration — run through `make mutants`, never bare.
#
# nextest runs each test in its own process and stops at the first failure,
# which is all a mutant run needs to know ("did anything catch it?").
test_tool = "nextest"

# The lib crate holds every unit test; test binaries and doctests are not
# rebuilt per mutant.
additional_cargo_test_args = ["--lib"]

# Generated code and fixtures are not ours to mutate.
exclude_globs = ["src/fixtures/**", "gen/**"]
